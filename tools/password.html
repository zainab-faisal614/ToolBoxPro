<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator - ToolBoxPro</title>

    <meta
        name="description"
        content="Generate strong random passwords with the free ToolBoxPro password generator."
    >

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            ToolBoxPro
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">Tools</a>
            <a href="../pages/about.html">About</a>
        </nav>

    </header>


    <!-- Password Generator -->
    <main>

        <section class="tool-page">

            <div class="tool-header">

                <span class="tool-icon">
                    🔐
                </span>

                <h1>
                    Password Generator
                </h1>

                <p>
                    Create strong random passwords quickly and easily.
                </p>

            </div>


            <div class="password-box">

                <label for="length">
                    Password Length
                </label>

                <input
                    type="number"
                    id="length"
                    min="4"
                    max="30"
                    value="12"
                >


                <div class="password-options">

                    <label>
                        <input
                            type="checkbox"
                            id="numbers"
                            checked
                        >
                        Include Numbers
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            id="symbols"
                            checked
                        >
                        Include Symbols
                    </label>

                </div>


                <button onclick="generatePassword()">
                    Generate Password
                </button>


                <div class="password-result">

                    <input
                        type="text"
                        id="password"
                        readonly
                        placeholder="Your password will appear here"
                    >

                    <button
                        class="copy-btn"
                        onclick="copyPassword()"
                    >
                        Copy Password
                    </button>

                </div>

            </div>


            <a href="../index.html" class="back-link">
                ← Back to All Tools
            </a>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 ToolBoxPro. All rights reserved.
        </p>

        <div class="footer-links">

            <a href="../pages/about.html">
                About
            </a>

            <a href="../pages/contact.html">
                Contact
            </a>

            <a href="../pages/privacy.html">
                Privacy Policy
            </a>

        </div>

    </footer>


    <script>

        function generatePassword() {

            let length =
                parseInt(document.getElementById("length").value);

            const includeNumbers =
                document.getElementById("numbers").checked;

            const includeSymbols =
                document.getElementById("symbols").checked;


            if (isNaN(length) || length < 4) {
                length = 4;
            }

            if (length > 30) {
                length = 30;
            }


            const letters =
                "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

            const numbers =
                "0123456789";

            const symbols =
                "!@#$%^&*()_+-=[]{}|;:,.<>?";


            let characters = letters;


            if (includeNumbers) {
                characters += numbers;
            }

            if (includeSymbols) {
                characters += symbols;
            }


            let password = "";


            for (let i = 0; i < length; i++) {

                const randomIndex =
                    Math.floor(Math.random() * characters.length);

                password += characters[randomIndex];
            }


            document.getElementById("password").value =
                password;
        }


        function copyPassword() {

            const password =
                document.getElementById("password");

            if (password.value === "") {
                return;
            }

            navigator.clipboard.writeText(password.value);

            alert("Password copied!");
        }

    </script>

</body>

</html>
