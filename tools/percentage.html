<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - ToolBoxPro</title>

    <meta
        name="description"
        content="Calculate percentages quickly and easily with the free ToolBoxPro percentage calculator."
    >

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            ToolBoxPro
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">Tools</a>
            <a href="../pages/about.html">About</a>
        </nav>

    </header>


    <!-- Calculator -->
    <main>

        <section class="tool-page">

            <div class="tool-header">

                <span class="tool-icon">
                    📊
                </span>

                <h1>
                    Percentage Calculator
                </h1>

                <p>
                    Quickly calculate a percentage of any number.
                </p>

            </div>


            <div class="calculator-box">

                <label for="number">
                    Enter Number
                </label>

                <input
                    type="number"
                    id="number"
                    placeholder="e.g. 500"
                >


                <label for="percentage">
                    Enter Percentage
                </label>

                <input
                    type="number"
                    id="percentage"
                    placeholder="e.g. 20"
                >


                <button onclick="calculatePercentage()">
                    Calculate
                </button>


                <div id="result" class="result">
                    Result will appear here
                </div>

            </div>


            <a href="../index.html" class="back-link">
                ← Back to All Tools
            </a>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 ToolBoxPro. All rights reserved.
        </p>

        <div class="footer-links">

            <a href="../pages/about.html">
                About
            </a>

            <a href="../pages/contact.html">
                Contact
            </a>

            <a href="../pages/privacy.html">
                Privacy Policy
            </a>

        </div>

    </footer>


    <script>

        function calculatePercentage() {

            const number =
                parseFloat(document.getElementById("number").value);

            const percentage =
                parseFloat(document.getElementById("percentage").value);

            const result =
                document.getElementById("result");


            if (isNaN(number) || isNaN(percentage)) {

                result.innerText =
                    "Please enter both values.";

                return;
            }


            const answer =
                (number * percentage) / 100;


            result.innerText =
                percentage + "% of " + number + " = " + answer;
        }

    </script>

</body>

</html>
